<div class="row g-1">
    <div class="col">
        <textarea autofocus class="form-control" rows=10 id="message-input" required
            placeholder="Содержание">{{message | default(value='') | safe}}</textarea>
        <input type="hidden" id="message" name="message" required value="{{message | default(value='')}}">
    </div>
    <div class="col border rounded" id="message-rendered">
    </div>
</div>
<div class="row mb-2">
    <div class="col">
        <small class="text-muted">
            Сообщение в формате <a href="https://www.markdownguide.org/basic-syntax/">markdown</a>
        </small>
    </div>
    <div class="col">
        <small class="text-muted">Превью сообщения</small>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script>

    function setupMarkdownEditor(root = document) {
        const editMessage = root.querySelector('#message-input');
        if (!editMessage || editMessage.dataset.markdownInitialized === 'true') {
            return;
        }

        const messageSend = root.querySelector('#message');
        const renderMessage = root.querySelector('#message-rendered');
        if (!messageSend || !renderMessage) {
            return;
        }

        const updateRenderedMessage = () => {
            const renderedMessage = marked.parse(editMessage.value);
            renderMessage.innerHTML = renderedMessage;
            messageSend.value = renderedMessage;
        };

        editMessage.addEventListener('input', updateRenderedMessage);
        editMessage.dataset.markdownInitialized = 'true';

        updateRenderedMessage();
    }

    setupMarkdownEditor();

    document.addEventListener('htmx:afterSwap', (event) => {
        setupMarkdownEditor(event.detail?.target ?? document);
    });

    document.addEventListener('htmx:afterSettle', (event) => {
        setupMarkdownEditor(event.detail?.target ?? document);
    });
</script>
