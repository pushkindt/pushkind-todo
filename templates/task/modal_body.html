{% import "components/macros.html" as macros %}

<form action="/task/{{ task.id }}/update" method="POST">

    <div class="row mb-3">
        <label for="modifyTaskTitle" class="col-md-2 col-form-label">Название</label>
        <div class="col-md-10">
            <input type="text" class="form-control" id="modifyTaskTitle" name="title" value="{{ task.title }}"
                placeholder="Название задачи" required>
        </div>
    </div>

    {{ macros::markdown(id=0, message=task.description) }}

    <div class="row mb-3">
        <label for="modifyTaskDueDate" class="col-md-2 col-form-label">Срок</label>
        <div class="col-md-10">
            <div class="input-group">
                <input type="date" class="form-control" id="modifyTaskDueDate" name="due_date"
                    value="{{ task.due_date | default(value='') }}">
                <button type="button" class="btn btn-outline-secondary" id="clearModifyTaskDueDate">
                    Очистить
                </button>
            </div>
            <div class="form-text">Оставьте поле пустым, чтобы не задавать срок.</div>
        </div>
    </div>

    <div class="row mb-3">
        <label for="modifyTaskStatus" class="col-md-2 col-form-label">Статус</label>
        <div class="col-md-10">
            <select class="form-select" id="modifyTaskStatus" name="status" required>
                <option value="Pending" {% if task.status=='Pending' %}selected{% endif %}>В ожидании</option>
                <option value="InProgress" {% if task.status=='InProgress' %}selected{% endif %}>В работе</option>
                <option value="Blocked" {% if task.status=='Blocked' %}selected{% endif %}>Заблокирована</option>
                <option value="Completed" {% if task.status=='Completed' %}selected{% endif %}>Завершена</option>
                <option value="Archived" {% if task.status=='Archived' %}selected{% endif %}>Архивирована</option>
            </select>
        </div>
    </div>
    <div class="row mb-3">
        <label for="taskModalTrack" class="col-md-2 col-form-label">Трек</label>
        <div class="col-md-10">
            <input name="track" list="available-tracks" type="text" class="form-control" id="taskModalTrack"
                placeholder="Трек" value="{{ task.track }}">
        </div>
    </div>
    <div class="row mb-3">
        <label for="taskModalPriority" class="col-md-2 col-form-label">Приоритет</label>
        <div class="col-md-10">
            <select name="priority" class="form-select" id="taskModalPriority" required>
                <option value="Middle" {% if task.priority=='Middle' %}selected{% endif %}>Средний</option>
                <option value="Low" {% if task.priority=='Low' %}selected{% endif %}>Низкий</option>
                <option value="High" {% if task.priority=='High' %}selected{% endif %}>Высокий</option>
            </select>
        </div>
    </div>

     {{ macros::task_assignee(assignee=assignee) }}
     {{ macros::task_client(client=client) }}

    <div class="row mb-3">
        <div class="col">
            <button class="btn btn-primary" type="submit">Сохранить</button>
        </div>
    </div>
</form>

<datalist id="available-tracks">
    {% for track in tracks %}
        <option value="{{track}}"></option>
    {% endfor %}
</datalist>
